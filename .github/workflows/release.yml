name: Release on tag
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: |
          mkdir -p /tmp/build
          cp -r . /tmp/build/pbn-hub-child
          cd /tmp/build
          rm -rf pbn-hub-child/.git pbn-hub-child/.github
          zip -r /tmp/pbn-hub-child.zip pbn-hub-child -x "*.DS_Store" "*node_modules*"
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pbn-hub-child.zip
          generate_release_notes: true
